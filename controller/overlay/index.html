<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Nejimakidori</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="renderer.mjs"></script>
</head>
<body>
  <header><strong>Nejimakidori</strong><button id="quit" aria-label="Quit">×</button></header>
  <main>
    <div class="status-row"><span id="status">Waiting</span><span id="seat"></span></div>
    <div id="decision" aria-live="polite">—</div>
    <div id="follow-up"></div>
    <div id="game" class="muted"></div>
    <p id="error" role="alert"></p>
    <button id="start" class="primary">Open Mahjong Soul</button>
    <details open>
      <summary>Connection</summary>
      <form id="settings">
        <label>API URL<input id="base" type="url" required spellcheck="false"></label>
        <label>API token<input id="token" type="password" required autocomplete="off"></label>
        <button type="submit">Connect</button><span id="connection" class="muted"></span>
      </form>
    </details>
    <button id="click-through">Enable click-through</button>
    <footer>Ctrl+Shift+O · click-through<br>Ctrl+Shift+H · hide/show</footer>
  </main>
</body>
</html>
