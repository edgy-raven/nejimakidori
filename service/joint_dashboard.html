<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nejimakidori · Training</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#0d121a;color:#e7edf7;--muted:#9aaac0;--line:#283447;--train:#64b5ff;--valid:#ffc273}*{box-sizing:border-box}body{margin:0}main{max-width:1500px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:26px;letter-spacing:-.7px;margin:5px 0 8px}h2{font-size:16px;margin:0}.eyebrow{color:#64b5ff;font-size:11px;letter-spacing:2px;text-transform:uppercase}.muted,small{color:var(--muted)}a{color:var(--train);text-decoration:none}a:hover{text-decoration:underline}.badge{background:#18352f;color:#8fe0b9;padding:7px 12px;border-radius:20px;font-size:12px}section{margin-top:24px}.progress-card,.card,.chart{background:#141d29;border:1px solid var(--line);border-radius:14px}.progress-card{padding:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.phases{display:flex;height:9px;border-radius:9px;overflow:hidden;margin:17px 0 11px;background:#283447}.segment{position:relative;border-right:3px solid #141d29}.segment span{display:block;background:#64b5ff;height:100%}.segment:nth-child(2) span{background:#91a6ff}.phase-labels{display:grid;grid-template-columns:1fr 2fr 1fr;color:var(--muted);font-size:12px}.phase-labels span:last-child{text-align:right}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:18px}.card h2{font-size:12px;color:var(--muted);font-weight:500}.number{font-size:29px;font-weight:600;letter-spacing:-1px;margin:10px 0 6px}.card small{font-size:11px;line-height:1.6;display:block}.controls{display:flex;gap:15px;align-items:center}select{background:#192536;color:#e7edf7;border:1px solid #43536c;border-radius:6px;padding:6px 10px}input{accent-color:var(--train)}.grid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:14px}.chart{padding:20px;min-width:0}.chart p{color:var(--muted);font-size:12px;margin:6px 0 16px}.plot{position:relative;height:245px}.plot svg{width:100%;height:100%;overflow:visible}.legend{font-size:12px;color:var(--muted);display:flex;gap:18px}.legend i{display:inline-block;width:15px;height:3px;margin-right:6px;vertical-align:middle}.tooltip{position:absolute;pointer-events:none;top:5px;right:15px;background:#0d121a;padding:7px 10px;border:1px solid #43536c;border-radius:6px;font-size:11px;white-space:pre-line}.tooltip:empty{display:none}footer{color:var(--muted);font-size:12px;line-height:1.7;margin-top:22px}#error{color:#ffb2ae}#error:empty{display:none}@media(max-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){main{padding:18px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}header{align-items:flex-start}.number{font-size:25px}.plot{height:210px}}
.component-controls{font-size:12px;color:var(--muted);margin-bottom:16px}.component-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px}.component-legend label{cursor:pointer}.chart:has(.component-controls) .plot{height:280px}.chart:first-child{grid-column:1/-1}.card:first-child .number{font-size:25px}
html,body{height:100%;overflow:hidden}
main{max-width:none;width:100%;height:100dvh;padding:10px 16px;display:flex;flex-direction:column;gap:7px}
header{flex:none;gap:12px}h1{font-size:17px;margin:0}.eyebrow,header .muted{display:none}header>div:last-child{display:flex;align-items:center;gap:14px}header p{margin:0}.badge{padding:4px 9px}
section{margin-top:0}.progress-card{padding:7px 12px;flex:none}.phases{height:5px;margin:6px 0 4px}.phase-labels{font-size:10px}.progress-card>.row:last-child{margin-top:4px!important;font-size:11px!important}.progress-card strong{font-size:12px}.progress-card #eta{font-size:11px}
.cards{display:flex;gap:20px;flex:none;padding:2px 12px}.card{border:0;background:none;border-radius:0;padding:0;display:flex;align-items:center;gap:9px;flex:1}.card h2{font-size:11px;white-space:nowrap}.number,.card:first-child .number{font-size:17px;margin:0;letter-spacing:0;white-space:nowrap}.card small{font-size:10px;line-height:1.2}
main>section:has(#charts){flex:1;min-height:0;display:flex;flex-direction:column;gap:5px}.legend,.controls{font-size:11px}.controls{gap:12px}select{padding:3px 6px}.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:6px;margin-top:0}.chart{padding:7px 12px;min-height:0;display:flex;flex-direction:column;border-radius:8px;position:relative}.chart h2{font-size:12px}.chart p{position:absolute;right:12px;top:7px;margin:0;font-size:10px}.component-controls{margin:2px 0;font-size:10px}.component-legend{gap:4px 12px;margin:0}.component-legend input{margin:0 3px 0 0;width:11px;height:11px}.plot,.chart:has(.component-controls) .plot{flex:1;height:auto;min-height:0}.tooltip{top:0;font-size:10px;z-index:2;max-height:100%;overflow:hidden}footer{margin:0;font-size:10px;line-height:1.2;flex:none}footer br,footer br~*{display:none}#error{margin:0;font-size:11px;flex:none}
@media(max-width:800px){main{padding:6px}.cards{gap:8px;padding:0 5px}.card{flex-wrap:wrap;gap:2px 6px}.card small{display:none}.chart p{display:none}.component-legend{gap:3px 7px}header a{font-size:11px}}
</style>
</head>
<body><main>
<header><div><div class="eyebrow">Nejimakidori / Joint training</div><h1>Learning, at a glance</h1><div class="muted">Imitation · board representation · payment critic</div></div><div><span class="badge" id="state">Connecting</span><p><a href="/tensorboard/charts/#custom_scalars">Detailed TensorBoard ↗</a></p></div></header>
<section class="progress-card"><div class="row"><strong id="progress">Loading run…</strong><span class="muted" id="eta"></span></div><div class="phases" id="phases"></div><div class="phase-labels"><span>Main · 25%</span><span>Focused · 50%</span><span>Main · 25%</span></div><div class="row muted" style="margin-top:17px;font-size:12px"><span id="exposures"></span><span><span id="throughput"></span> · 5 GPUs · batch 5,120</span></div></section>
<section class="cards" id="cards"></section>
<section><div class="row"><div class="legend"><span>Solid: training</span><span>Dashed + dots: validation</span></div><div class="controls"><label><input id="smooth" type="checkbox" checked> Smooth training</label><select id="range" aria-label="Chart range"><option value="all">Entire run</option><option value="recent">Last 5,000 updates</option></select></div></div><div class="grid" id="charts"></div></section>
<p id="error" role="status"></p><footer title="Loss components are divided by their first nonzero training value; validation uses the same scale. Hover shows raw values. Throughput includes validation/checkpoint pauses. Smoothing affects charts only."><span id="updated"></span> · Hover charts for values</footer>
</main><script src="/tensorboard/joint-dashboard.js"></script></body></html>
